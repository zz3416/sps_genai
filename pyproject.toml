[project]
name = "sps-genai"
version = "0.1.0"
description = "FastAPI services for the Applied Generative AI course assignments"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "python-multipart>=0.0.32",
    "spacy>=3.8.16",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "uvicorn>=0.53.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
